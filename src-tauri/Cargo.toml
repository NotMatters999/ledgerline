[package]
name = "ledgerline"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ledgerline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "2.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
duckdb = { version = "=1.10504.0", features = ["chrono", "bundled"] }
calamine = "=0.36.0"
csv = "=1.4.0"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.23.4", features = ["v4"] }
thiserror = "=2.0.18"
sha2 = "=0.10.9"
genpdf = "=0.2.0"

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
opt-level = "z"        # Optimize for size (benchmarked safe at <200ms for forecast recalc)
lto = "fat"            # Full cross-crate LTO. NOTE: lto=true and lto="fat" are identical per Cargo
                       # reference — this was already fat LTO before the optimization pass.
codegen-units = 1      # Single codegen unit enables maximum inlining across crates
strip = true           # Strip debug symbols from final binary
panic = "abort"        # Removes stack-unwinding machinery. Safe: all panic-prone sites in
                       # import/validation/engines are guarded (divisions checked, unwraps
                       # guarded by is_complete(), no reachable unhandled panics found in audit).

