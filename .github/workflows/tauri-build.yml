name: Tauri Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ── Fast Syntax & Type Check ────────────────────────────────────────────────
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        run: pnpm exec tsc --noEmit

      - name: Check Rust (all targets)
        run: cargo check --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Run Backend Tests
        run: cargo test --test verification_test -- --nocapture
        working-directory: src-tauri

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  # ── Windows Full Build ──────────────────────────────────────────────────────
  build-windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm run tauri build

      - name: Upload Windows Installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ledgerline-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows Portable (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ledgerline-windows-portable
          path: src-tauri/target/release/ledgerline.exe

      # Collect bundles into a flat staging dir for the release step
      - name: Stage release files (Windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-staging | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi    release-staging/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe   release-staging/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/ledgerline.exe      release-staging/ledgerline-portable.exe -ErrorAction SilentlyContinue

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LedgerLine — latest"
          body: |
            ## LedgerLine

            Automated release from commit ${{ github.sha }} (`${{ github.ref_name }}`).

            ### Downloads
            | File | Description |
            |------|-------------|
            | `*.msi` | Windows Installer (recommended) — double-click to install |
            | `*-setup.exe` | NSIS lightweight installer |
            | `ledgerline-portable.exe` | Portable — no installation needed, run directly |

            ---
            Built and verified by GitHub Actions.
          prerelease: false
          make_latest: true
          files: release-staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
